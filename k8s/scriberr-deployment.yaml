apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: scriberr
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "200m" # Larger for audio/video files
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600" # Long transcriptions can take time
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "600"
spec:
  ingressClassName: nginx
  rules:
    - host: scriberr.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: scriberr
                port:
                  number: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: scriberr
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: scriberr
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scriberr
  labels:
    app: scriberr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scriberr
  template:
    metadata:
      labels:
        app: scriberr
    spec:
      containers:
        - name: scriberr
          image: ghcr.io/rishikanthc/scriberr:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - secretRef:
                name: scriberr-secret
          env:
            - name: TZ
              value: "Asia/Hong_Kong"
            - name: APP_ENV
              value: "production"
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          resources:
            requests:
              memory: "2Gi"
              cpu: "500m"
            limits:
              memory: "8Gi" # Models + diarization can be memory hungry
              # cpu: "4"
          volumeMounts:
            - name: scriberr-data
              mountPath: /app/data # DB, uploads, transcripts
            - name: scriberr-env
              mountPath: /app/whisperx-env # Models + Python envs (important!)
      volumes:
        - name: scriberr-data
          hostPath:
            path: /mnt/workspaces/scriberr/data
            type: DirectoryOrCreate
        - name: scriberr-env
          hostPath:
            path: /mnt/workspaces/scriberr/whisperx-env
            type: DirectoryOrCreate
